<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BookLeaf Royalty Portal</title><style>body{font:15px system-ui;background:#f4f7fb;color:#18334c;margin:0}header{background:#174c70;color:white;padding:22px 6%}main{max-width:1100px;margin:30px auto;padding:0 20px}.panel{background:white;border:1px solid #dbe4ed;border-radius:12px;padding:22px;margin:16px 0;box-shadow:0 3px 14px #173b5610}input,select,button{padding:11px;border:1px solid #c7d5e0;border-radius:7px;margin:5px}button{background:#17658d;color:white;cursor:pointer}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:11px;border-bottom:1px solid #e7eef3;text-align:left}.scroll{overflow:auto}.stats{display:flex;gap:15px;flex-wrap:wrap}.stats .panel{flex:1;min-width:160px}.badge{padding:5px 9px;border-radius:20px;background:#e4eaf0}.Paid{background:#d9f7e4}.Pending{background:#fff0c3}.Overdue{background:#ffd7d7}#app{display:none}</style></head><body><header><h1>BookLeaf Publishing</h1>Author Royalty Dashboard & Notifications</header><main><section id="login" class="panel"><h2>Sign in</h2><p>Demo admin: admin@bookleaf.demo / Admin@12345<br>Demo author: priya.sharma@email.com / Author@12345</p><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><p id="error"></p></section><section id="app"><button onclick="logout()">Log out</button><div id="content"></div></section></main><script>
let jwt='',role='',authors=[],selected=null;const $=id=>document.getElementById(id);const money=n=>'₹'+Number(n||0).toLocaleString('en-IN');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,method='GET',data){let r=await fetch(url,{method,headers:{'Content-Type':'application/json',Authorization:'Bearer '+jwt},body:data?JSON.stringify(data):undefined});let v=await r.json();if(!r.ok)throw Error(v.error||'Request failed');return v}async function login(){try{let x=await api('/api/login','POST',{email:$('email').value,password:$('password').value});jwt=x.token;role=x.role;$('login').style.display='none';$('app').style.display='block';await refresh()}catch(e){$('error').textContent=e.message}}function logout(){jwt='';$('app').style.display='none';$('login').style.display='block'}function stats(a){return `<div class="stats">${[['Books',a.total_books],['Earned',money(a.total_earned)],['Paid',money(a.total_paid)],['Pending',money(a.total_pending)]].map(x=>`<div class="panel"><small>${x[0]}</small><h2>${x[1]}</h2></div>`).join('')}</div>`}function books(a){return `<div class="panel scroll"><h3>My Books / Royalty Overview</h3><table><tr><th>Title</th><th>ISBN / Genre</th><th>Status / Published</th><th>MRP / Platforms</th><th>Sold</th><th>Earned</th><th>Paid</th><th>Pending</th><th>Last payout</th><th>Indicator</th></tr>${a.books.map(b=>`<tr><td>${esc(b.title)}</td><td>${esc(b.isbn)}<br>${esc(b.genre)}</td><td>${esc(b.status)}<br>${esc(b.publication_date||'—')}</td><td>${b.mrp==null?'—':money(b.mrp)}<br>${esc(b.available_on.join(', '))}</td><td>${b.total_copies_sold}</td><td>${money(b.total_royalty_earned)}</td><td>${money(b.royalty_paid)}</td><td>${money(b.royalty_pending)}</td><td>${esc(b.last_royalty_payout_date||'Never')}</td><td><span class="badge ${b.payout_status}">${b.payout_status}</span></td></tr>`).join('')}</table></div>`}async function refresh(){if(role==='author'){let a=(await api('/api/me')).author;$('content').innerHTML=`<h2>Welcome, ${esc(a.name)}</h2>${stats(a)}${books(a)}`}else{authors=await api('/api/authors');renderAdmin()}}function renderAdmin(){let cities=[...new Set(authors.map(a=>a.city))];$('content').innerHTML=`<h2>Admin Dashboard</h2><div class="panel"><input id="search" placeholder="Search author" oninput="filter()"><select id="city" onchange="filter()"><option value="">All cities</option>${cities.map(c=>`<option>${esc(c)}</option>`).join('')}</select><select id="status" onchange="filter()"><option value="">All statuses</option><option>Paid</option><option>Pending</option><option>Overdue</option></select><button onclick="trigger(true)">Generate summaries for all pending</button></div><div id="authorList"></div><div id="detail"></div><div id="logs"></div>`;filter();showLogs()}function filter(){let q=$('search').value.toLowerCase(),city=$('city').value,status=$('status').value;let aa=authors.filter(a=>a.name.toLowerCase().includes(q)&&(!city||a.city===city)&&(!status||a.payout_status===status));$('authorList').innerHTML=`<div class="panel scroll"><table><tr><th>Author</th><th>City</th><th>Books</th><th>Earned</th><th>Pending</th><th>Status</th><th>Action</th></tr>${aa.map(a=>`<tr><td>${esc(a.name)}</td><td>${esc(a.city)}</td><td>${a.total_books}</td><td>${money(a.total_earned)}</td><td>${money(a.total_pending)}</td><td><span class="badge ${a.payout_status}">${a.payout_status}</span></td><td><button onclick="detail('${a.author_id}')">View</button></td></tr>`).join('')}</table></div>`}function detail(id){selected=authors.find(a=>a.author_id===id);$('detail').innerHTML=`<h2>${esc(selected.name)} — ${esc(selected.email)}</h2>${stats(selected)}<button onclick="trigger(false)">Generate & Send Royalty Summary</button>${books(selected)}`}async function trigger(bulk){try{let x=await api('/api/trigger','POST',bulk?{bulk:true}:{author_id:selected.author_id});alert('Created '+x.length+' notification request(s). Check log for result.');await showLogs()}catch(e){alert(e.message)}}async function showLogs(){let logs=await api('/api/logs');$('logs').innerHTML=`<div class="panel scroll"><h3>Notification Log <button onclick="showLogs()">Refresh</button></h3><table><tr><th>Author</th><th>Created</th><th>Status</th><th>Details</th></tr>${logs.map(l=>`<tr><td>${esc(l.author_name)}</td><td>${esc(l.created_at)}</td><td>${esc(l.status)}</td><td>${esc(l.message)}</td></tr>`).join('')}</table></div>`}</script></body></html>
